[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roomweaver-studio"
version = "0.1.0"
description = "Local interior GLB editing, lighting and Blender panorama rendering"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
dependencies = [
  "fastapi==0.142.2", "uvicorn==0.54.0", "pydantic==2.13.5",
  "python-multipart==0.0.32", "Pillow==12.3.0", "httpx==0.28.1",
  "langgraph==1.2.14", "langgraph-checkpoint-sqlite==3.1.1"
]

[project.optional-dependencies]
agent = ["mcp==2.3.0", "playwright==1.63.0"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
roomweaver = "interior.workbench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
interior = ["workbench_web/dist/*", "workbench_web/dist/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["integration"]
